name: Interactive desktop smoke tests

# Dispatch trusted refs only. The runner must run in an unlocked user session.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interactive-desktop-tests
  cancel-in-progress: false

jobs:
  interactive-desktop:
    runs-on: [self-hosted, Windows, X64, interactive-desktop]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build solution
        run: dotnet build LogReader/LogReader.sln -c Release -m:1
      - name: Verify real desktop dialogs
        shell: pwsh
        run: ./.github/scripts/Invoke-InteractiveDesktopTests.ps1
      - name: Upload interactive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-desktop-results
          path: artifacts/test-results/interactive-desktop/**/*.trx
          if-no-files-found: warn
