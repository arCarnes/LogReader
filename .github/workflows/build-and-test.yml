name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build solution
        run: dotnet build LogReader/LogReader.sln -c Release -m:1
      - name: Build log generator
        run: dotnet build LogGenerator/LogGenerator.sln -c Release -m:1
      - name: Validate release versioning and packaging inputs without GitHub access
        shell: pwsh
        run: |
          & ./LogReader/packaging/scripts/Test-ZipArtifactValidation.ps1
          & ./LogReader/packaging/scripts/Test-SharedArtifactValidation.ps1
          & ./LogReader/packaging/scripts/Test-LauncherReleaseValidation.ps1
      - name: Report desktop coverage excluded from this lane
        shell: pwsh
        run: |
          $coverageNote = 'Service-safe lane explicitly excludes Category=InteractiveDesktop (LauncherTests.Desktop_ShowsDeploymentErrorAndReturnsFailure). Real dialog coverage runs in the manually dispatched Interactive desktop smoke tests workflow.'
          Write-Output $coverageNote
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $coverageNote
      - name: Test solution without interactive desktop requirements
        run: dotnet test LogReader/LogReader.sln -c Release --no-build --no-restore -m:1 --filter "Category!=InteractiveDesktop" --logger trx --results-directory artifacts/test-results/service-safe
      - name: Upload service-safe test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-safe-results
          path: artifacts/test-results/service-safe/**/*.trx
          if-no-files-found: warn
